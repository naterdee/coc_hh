<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Project Hammerhead</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="banner"></div>

<!-- Login screen -->
<section id="loginView" hidden>
  <div class="panel">
    <form id="loginForm">
      <h1>Project Hammerhead</h1>
      <small>Sign in with the account your admin created for you.</small>
      <label>Email <input type="email" name="email" autocomplete="username" required></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary" id="loginBtn">Sign in</button>
    </form>
  </div>
</section>

<!-- App -->
<div id="appView" hidden>
  <header>
    <div class="bar">
      <h1>Project Hammerhead</h1>
      <nav class="view-nav" aria-label="Main views">
        <button type="button" class="primary" id="peopleViewBtn" aria-current="page">People</button>
        <button type="button" id="calendarViewBtn">Calendar</button>
      </nav>
      <div id="peopleControls" class="toolbar-group">
        <input type="search" id="search" placeholder="Search names, tags, notes, logs…">
        <select id="filterBy" aria-label="Filter"></select>
        <select id="sortBy" aria-label="Sort">
          <option value="name">Sort: Name</option>
          <option value="updated">Sort: Recently updated</option>
        </select>
        <button type="button" class="primary" id="addBtn">+ Add person</button>
      </div>
      <button id="menuBtn" aria-label="More">⋯</button>
    </div>
  </header>
  <main>
    <section id="peopleView">
      <div class="count" id="count"></div>
      <div class="grid" id="list"></div>
    </section>
    <section id="calendarView" hidden>
      <div class="calendar-toolbar">
        <div class="view-nav" aria-label="Calendar views">
          <button type="button" class="primary" id="weekViewBtn" aria-current="page">Week schedule</button>
          <button type="button" id="detailsViewBtn">All meeting logs</button>
        </div>
        <div id="weekControls" class="calendar-controls">
          <button type="button" id="prevWeekBtn" aria-label="Previous week">‹</button>
          <button type="button" id="todayWeekBtn">This week</button>
          <button type="button" id="nextWeekBtn" aria-label="Next week">›</button>
          <strong id="weekLabel"></strong>
        </div>
        <button type="button" class="primary" id="addMeetingBtn">+ Add meeting</button>
      </div>
      <div id="weekSchedule"></div>
      <div id="meetingLogDetails" hidden></div>
    </section>
  </main>
</div>

<dialog id="menuDlg">
  <form method="dialog" id="menuForm">
    <h2>Menu</h2>
    <small id="whoami"></small>
    <button type="button" id="exportBtn">Download people (CSV)</button>
    <button type="button" id="exportMeetingsBtn">Download recurring meetings (CSV)</button>
    <button type="button" id="exportLogsBtn">Download log entries (CSV)</button>
    <button type="button" id="importBtn">Import from CSV…</button>
    <input type="file" id="importFile" accept=".csv,text/csv" hidden>
    <button type="button" id="pwBtn">Change my password</button>
    <button type="button" id="signOutBtn" class="danger">Sign out</button>
    <div class="actions"><button type="submit">Close</button></div>
  </form>
</dialog>

<dialog id="personDlg">
  <form id="personForm">
    <h2 id="dlgTitle">Add person</h2>
    <label>Name <input type="text" name="name" required></label>
    <label>Contact info <input type="text" name="contact" placeholder="Phone / email"></label>
    <div class="tagbox">
      <span class="lbl">Tags</span>
      <div class="tagfield" id="tagField">
        <span id="tagChips"></span>
        <input type="text" id="tagInput" list="tagSuggestions" placeholder="Type a tag, press Enter" autocomplete="off">
      </div>
      <datalist id="tagSuggestions"></datalist>
    </div>
    <section class="logsec">
      <div class="logsec-head">
        <strong>Recurring meetings</strong>
        <button type="button" id="addPersonMeetingBtn">+ Add meeting</button>
      </div>
      <div id="personMeetings"></div>
    </section>
    <label>Notes <small>(background that doesn't change much)</small>
      <textarea name="notes" class="short" placeholder="Interests, family context, ongoing prayer needs…"></textarea></label>
    <div class="logsec">
      <div class="logsec-head">
        <strong>Log</strong>
        <button type="button" id="addLogBtn">+ Add entry</button>
      </div>
      <div id="logList"></div>
    </div>
    <div class="actions">
      <button type="button" class="danger left" id="deleteBtn">Delete</button>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary" id="savePersonBtn">Save entry</button>
    </div>
  </form>
</dialog>

<dialog id="meetingDlg">
  <form id="meetingForm">
    <h2 id="meetingDlgTitle">Add recurring meeting</h2>
    <input type="hidden" name="id">
    <label>Person <select name="person_id" id="meetingPerson" required></select></label>
    <label>Meeting name <small>(optional)</small>
      <input type="text" name="title" maxlength="120" placeholder="e.g. Coffee catch-up">
    </label>
    <div class="two">
      <label>Day <select name="meeting_day" id="meetingDay" required></select></label>
      <label>Time <input type="time" name="meeting_time" required></label>
    </div>
    <div class="two">
      <label>How often
        <select name="frequency">
          <option value="Weekly">Every week</option>
          <option value="Every 2 weeks">Every 2 weeks</option>
          <option value="Monthly">Monthly</option>
        </select>
      </label>
      <label>Starts on <input type="date" name="start_date" required></label>
    </div>
    <div class="actions">
      <button type="button" class="danger left" id="deleteMeetingBtn" hidden>Delete meeting</button>
      <button type="button" id="cancelMeetingBtn">Cancel</button>
      <button type="submit" class="primary" id="saveMeetingBtn">Save meeting</button>
    </div>
  </form>
</dialog>

<dialog id="occurrenceDlg">
  <form id="occurrenceForm">
    <h2 id="occurrenceTitle">Meeting</h2>
    <div id="occurrenceLogs"></div>
    <label>Add a log for this meeting
      <textarea name="body" required placeholder="Add notes about this meeting…"></textarea>
    </label>
    <div class="actions">
      <button type="button" id="cancelOccurrenceBtn">Close</button>
      <button type="submit" class="primary" id="saveOccurrenceBtn">Add log</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
